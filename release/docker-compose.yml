# Nommable Docker Deployment
#
# Secrets are NOT stored here. Copy `.env.example` to `.env` in this folder,
# fill in real values, then run: docker compose up -d
# (The `:?` syntax below fails fast with a clear message if a secret is missing.)

x-config:
  # =========================================================================
  # REQUIRED — set these in `.env` before deploying
  # =========================================================================
  - &db_password      ${POSTGRES_PASSWORD: <redacted>   # PostgreSQL password — generate: openssl rand -hex 24
  - &jwt_secret       ${JWT_SECRET: <redacted>          # JWT signing secret — generate: openssl rand -hex 32 (32+ chars)
  - &encryption_key   ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}         # AI-key encryption (64 hex chars)
  - &admin_username   ${ADMIN_USERNAME:-admin}                                     # Initial admin username
  - &admin_password   ${ADMIN_PASSWORD: <redacted>      # Initial admin password — change after first login

  # =========================================================================
  # OPTIONAL — Defaults are fine for most setups (override in `.env` if needed)
  # =========================================================================
  - &cors_origin      "${CORS_ORIGIN:-http://localhost:8765}"             # Allowed CORS origin (change to your hostname)
  - &frontend_port    "${FRONTEND_PORT:-8765}"                             # Host port for web UI
  - &backend_port     "${BACKEND_PORT:-8766}"                             # Host port for API
  - &max_file_size    "${MAX_FILE_SIZE:-5242880}"                          # Max upload size in bytes (5MB)

  # =========================================================================
  # AI PROVIDERS — All optional
  # =========================================================================
  - &openai_api_key   "${OPENAI_API_KEY: <redacted>                         # OpenAI API key
  - &anthropic_api_key "${ANTHROPIC_API_KEY: <redacted>                     # Anthropic API key
  - &google_ai_api_key "${GOOGLE_AI_API_KEY: <redacted>                     # Google AI API key
  - &ollama_base_url  "${OLLAMA_BASE_URL:-http://localhost:11434}"        # Ollama server URL

services:
  postgres:
    image: postgres:16-alpine
    container_name: nommable-postgres
    environment:
      POSTGRES_DB: nommable
      POSTGRES_USER: nommable
      POSTGRES_PASSWORD: *db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nommable']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nommable-network

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      args:
        - NODE_OPTIONS=--max-old-space-size=2048
    container_name: nommable-backend
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nommable
      DATABASE_USER: nommable
      DATABASE_PASSWORD: *db_password
      # Schema is created and upgraded automatically by migrations on startup, so
      # a fresh install works out of the box and upgrades apply cleanly. Leave this
      # 'false' in production. Set 'true' only for development schema auto-sync.
      DB_SYNCHRONIZE: 'false'
      JWT_SECRET: *jwt_secret
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: *encryption_key
      ADMIN_USERNAME: *admin_username
      ADMIN_PASSWORD: *admin_password
      CORS_ORIGIN: *cors_origin
      OPENAI_API_KEY: *openai_api_key
      ANTHROPIC_API_KEY: *anthropic_api_key
      GOOGLE_AI_API_KEY: *google_ai_api_key
      OLLAMA_BASE_URL: *ollama_base_url
      MAX_FILE_SIZE: *max_file_size
    ports:
      - '${BACKEND_PORT:-8766}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - nommable-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        - NODE_OPTIONS=--max-old-space-size=2048
    container_name: nommable-front
    ports:
      - '${FRONTEND_PORT:-8765}:80'
    depends_on:
      - backend
    networks:
      - nommable-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:

networks:
  nommable-network:
    driver: bridge
