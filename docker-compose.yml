# Nirugisa — Docker Compose
#
# Secrets are NOT stored here. Set them as stack environment variables in
# Portainer (Stacks -> nirugisa -> Environment variables), or copy
# `.env.example` to `.env` and fill in real values before running:
#
#   cp .env.example .env
#   docker compose up -d
#
# The `:?` syntax below makes compose fail fast with a clear message if a
# required secret is missing.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nirugisa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nirugisa}
      POSTGRES_USER: ${POSTGRES_USER:-nirugisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nirugisa}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: nirugisa-backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-nirugisa}
      DATABASE_USER: ${POSTGRES_USER:-nirugisa}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Schema is built/upgraded by migrations on startup (see migrationsRun).
      # Set 'true' only to auto-sync the schema from entities during development.
      DB_SYNCHRONIZE: 'false'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8765}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env (64 hex chars)}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@nirugisa.local}
    ports:
      - '8766:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - uploads:/app/packages/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: nirugisa-frontend
    ports:
      - '8765:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
